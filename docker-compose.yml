services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_AUTH_MODE: oidc
      ALLOWED_EMAILS: "${ALLOWED_EMAILS:?Set ALLOWED_EMAILS in .env}"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      LOTTERY_DATA_DIR: /app/data
      LOTTERY_DB_PATH: /app/data/lottery_v2.sqlite3
    volumes: ["lottery_data:/app/data", "lottery_backups:/app/backups", "./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro"]
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on:
      app:
        condition: service_healthy
volumes:
  lottery_data: {}
  lottery_backups: {}
  caddy_data: {}
  caddy_config: {}
